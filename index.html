<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GST Return Questionnaire – Monteck Carter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-900:#2a0a5e;
    --purple-800:#3b0f80;
    --purple-600:#5b2da6;
    --purple-100:#f1ecfa;
    --purple-50:#f7f4fc;
    --green:#7ac70c;
    --green-dark:#5da000;
    --ink:#241a38;
    --muted:#6b6480;
    --line:#e3deee;
    --bg:#ffffff;
    --error:#c0262d;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:#f4f2f8;color:var(--ink);
    font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:15px;line-height:1.45;
  }
  .sheet{max-width:860px;margin:24px auto;background:var(--bg);box-shadow:0 8px 30px rgba(42,10,94,.12);border-radius:6px;overflow:hidden}

  /* Header */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 32px 14px;align-items:center}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{display:block;height:84px;width:auto;max-width:100%}
  .title{text-align:right}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green-dark);text-transform:uppercase}
  .eyebrow::before{content:"";width:22px;height:3px;background:var(--green);border-radius:2px}
  .title h1{margin:2px 0 0;font-size:28px;line-height:1.1;font-weight:700;color:var(--purple-900)}

  /* Details band */
  .band{background:var(--purple-900);color:#fff;display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px;padding:16px 32px 18px}
  .band label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b9a6e6}
  .band input{
    width:100%;margin-top:4px;padding:4px 0 6px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.35);
    color:#fff;font:inherit;font-size:15px;outline:none;border-radius:0
  }
  .band input::placeholder{color:#d9cdf5;opacity:.9}
  .band input:focus{border-bottom-color:var(--green)}
  .band input[type=date]{color-scheme:dark}

  .intro{padding:22px 32px 6px;font-size:13px;color:var(--muted);max-width:620px}
  .intro strong{color:var(--ink)}

  /* Sections */
  form{padding:0 32px 32px}
  .sec{display:flex;align-items:center;gap:12px;margin-top:22px;padding-bottom:6px;border-bottom:2px solid var(--purple-900)}
  .sec .num{width:30px;height:30px;border-radius:5px;background:var(--green);color:var(--purple-900);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
  .sec h2{margin:0;font-size:17px;font-weight:600;color:var(--purple-900);flex:1}
  .sec .tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}

  .q{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .q:last-of-type{border-bottom:0}
  .q .n{font-weight:700;color:var(--green-dark);align-self:start;padding-top:1px}
  .q .t strong{display:block;font-size:14px;font-weight:600;color:var(--ink)}
  .q .t small{display:block;margin-top:4px;font-size:12px;color:var(--muted);max-width:560px}
  .q em, .intro em{font-style:italic;font-weight:600;color:var(--purple-600)}
  .q.invalid{background:#fff6f6;box-shadow:-3px 0 0 var(--error);padding-left:8px;margin-left:-8px}
  .q.invalid .n{color:var(--error)}

  /* Yes / No */
  .yn{display:flex;gap:16px}
  .yn label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:500;user-select:none}
  .yn input{position:absolute;opacity:0;pointer-events:none}
  .yn .box{width:17px;height:17px;border:1.5px solid #8a7fa6;border-radius:4px;display:grid;place-items:center;background:#fff;transition:.12s}
  .yn .box::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
  .yn input:checked + .box{background:var(--purple-800);border-color:var(--purple-800)}
  .yn input:checked + .box::after{opacity:1}
  .yn input:focus-visible + .box{outline:3px solid rgba(122,199,12,.55);outline-offset:2px}
  .yn label:hover .box{border-color:var(--purple-800)}

  /* Declaration */
  .decl{margin-top:26px;background:var(--purple-50);border-left:4px solid var(--green);border-radius:4px;padding:14px 16px;font-size:12.5px;color:var(--muted)}
  .decl strong{color:var(--purple-900)}
  .sign{display:grid;grid-template-columns:1fr 200px;gap:28px;margin-top:22px;align-items:end}
  .sign label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .pad{position:relative;border-bottom:1.5px solid var(--purple-900);height:80px;margin-top:4px;background:repeating-linear-gradient(transparent,transparent 79px,transparent 80px)}
  .pad canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .pad .hint{position:absolute;left:0;bottom:6px;font-size:12px;color:#b3acc7;pointer-events:none}
  .pad.signed .hint{display:none}
  .clear{margin-top:6px;background:none;border:0;padding:0;color:var(--purple-600);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
  .sign input[type=date]{width:100%;margin-top:4px;border:0;border-bottom:1.5px solid var(--purple-900);padding:6px 0;font:inherit;background:transparent;outline:none;border-radius:0}
  .sign.invalid .pad,.sign.invalid input[type=date]{border-bottom-color:var(--error)}

  .actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:26px;flex-wrap:wrap}
  .msg{margin-right:auto;font-size:13px}
  .msg.err{color:var(--error)} .msg.ok{color:var(--green-dark);font-weight:600}
  button.btn{font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:11px 22px;cursor:pointer;border:2px solid var(--purple-900)}
  .btn.primary{background:var(--purple-900);color:#fff}
  .btn.primary:hover{background:var(--purple-800)}
  .btn.ghost{background:#fff;color:var(--purple-900)}
  .btn.ghost:hover{background:var(--purple-50)}
  .btn[disabled]{opacity:.6;cursor:wait}

  /* Mobile */
  @media (max-width:640px){
    .sheet{margin:0;border-radius:0}
    .brand img{height:68px}
    .top{flex-direction:column;padding:18px 18px 12px}
    .title{text-align:left}
    .band{grid-template-columns:1fr 1fr;gap:16px 20px;padding:14px 18px 18px;margin:0 -18px !important}
    .band > div:first-child{grid-column:1/-1}
    .intro{padding:18px 18px 4px}
    form{padding:0 18px 26px}
    .sec .tag{display:none}
    .q{grid-template-columns:22px 1fr}
    .q .yn{grid-column:2;margin-top:6px}
    .sign{grid-template-columns:1fr}
  }

  @media print{
    body{background:#fff}
    .sheet{box-shadow:none;margin:0;max-width:none}
    .actions,.clear{display:none}
    .band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sec .num,.decl,.yn .box{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .q{break-inside:avoid}
  }

  /* ---------- PDF render (built offscreen on submit, never visible) ---------- */
  #pdfRoot{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#241a38;font-family:'Figtree',Arial,sans-serif;font-size:12.5px;line-height:1.4}
  #pdfRoot *{box-sizing:border-box}
  #pdfRoot .ptop{display:flex;justify-content:space-between;align-items:center;padding:6px 36px 12px}
  #pdfRoot .ptop img{height:76px;width:auto;display:block}
  #pdfRoot .ptitle{text-align:right}
  #pdfRoot .peyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;color:#5da000}
  #pdfRoot h1{margin:2px 0 0;font-size:25px;line-height:1.1;font-weight:700;color:#2a0a5e}
  #pdfRoot .pband{background:#2a0a5e;color:#fff;display:flex;gap:28px;padding:14px 36px 16px}
  #pdfRoot .pband div{flex:1}
  #pdfRoot .pband div:first-child{flex:2}
  #pdfRoot .pband small{display:block;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b9a6e6}
  #pdfRoot .pband b{display:block;margin-top:4px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.4);font-size:14px;font-weight:600;min-height:24px}
  #pdfRoot .pbody{padding:0 36px}
  #pdfRoot .pintro{margin:16px 0 0;font-size:11.5px;color:#6b6480}
  #pdfRoot .psec{display:flex;align-items:center;gap:10px;margin-top:18px;padding-bottom:5px;border-bottom:2px solid #2a0a5e}
  #pdfRoot .pnum{width:26px;height:26px;border-radius:4px;background:#7ac70c;color:#2a0a5e;font-weight:700;font-size:13px;text-align:center;line-height:26px}
  #pdfRoot .psec h2{flex:1;margin:0;font-size:15px;font-weight:600;color:#2a0a5e}
  #pdfRoot .ptag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6b6480}
  #pdfRoot .pq{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e3deee}
  #pdfRoot .pq .pn{width:18px;flex:none;font-weight:700;color:#5da000;align-self:flex-start}
  #pdfRoot .pq .pt{flex:1}
  #pdfRoot .pq .pt strong{display:block;font-size:12.5px;font-weight:600}
  #pdfRoot .pq .pt small{display:block;margin-top:3px;font-size:10.5px;color:#6b6480}
  #pdfRoot em{font-style:italic;font-weight:600;color:#5b2da6}
  #pdfRoot .pyn{display:flex;gap:14px;flex:none;font-size:12px;font-weight:500}
  #pdfRoot .pyn span.l{display:inline-flex;align-items:center;gap:6px}
  #pdfRoot .pbox{display:inline-block;width:16px;height:16px;border:1.5px solid #8a7fa6;border-radius:3px;text-align:center;line-height:13px;font-size:12px;font-weight:700;color:#fff;background:#fff}
  #pdfRoot .pbox.on{background:#3b0f80;border-color:#3b0f80}
  #pdfRoot .pdecl{margin-top:20px;background:#f7f4fc;border-left:4px solid #7ac70c;border-radius:3px;padding:12px 14px;font-size:11.5px;color:#6b6480}
  #pdfRoot .pdecl strong{color:#2a0a5e}
  #pdfRoot .psign{display:flex;gap:28px;margin-top:18px;align-items:flex-end;padding-bottom:20px}
  #pdfRoot .psign > div{flex:1}
  #pdfRoot .psign > div:last-child{flex:0 0 190px}
  #pdfRoot .psign small{display:block;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6b6480}
  #pdfRoot .psigbox{height:70px;margin-top:4px;border-bottom:1.5px solid #2a0a5e;display:flex;align-items:flex-end}
  #pdfRoot .psigbox img{max-height:66px;max-width:100%;display:block}
  #pdfRoot .pdate{height:70px;margin-top:4px;border-bottom:1.5px solid #2a0a5e;display:flex;align-items:flex-end;padding-bottom:6px;font-size:13px;font-weight:600}
  #pdfRoot .pfoot{padding:0 36px 8px;font-size:9.5px;color:#9a93ad}
  .dlhint{font-size:13px}
  @media print{#pdfRoot{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>

    <div class="title">
      <div class="eyebrow">GST · Client checklist</div>
      <h1>GST Return Questionnaire</h1>
    </div>
  </header>

  <form id="gst" novalidate>
    <!-- Details band sits inside the form so the fields submit with it -->
  </form>
</div>

<script>
/* ------------------------------------------------------------------
   CONFIG
   SUBMIT_URL  – the endpoint from your form service (Formspree, Web3Forms,
                 Basin, etc.). The service is set up with the address the
                 forms should be emailed to – that address is NOT put in
                 this page.
   FILE_FIELD  – the field name your service expects for an attached file
                 ("attachment" for Web3Forms; Formspree accepts any name).
   EXTRA_FIELDS – any extra fields the service needs, e.g. Web3Forms:
                 { access_key: "YOUR-ACCESS-KEY" }
   File attachments are a paid feature on some services – check yours.
   Leave SUBMIT_URL empty to just download the completed PDF instead.
------------------------------------------------------------------- */
const SUBMIT_URL   = "";   // e.g. "https://api.web3forms.com/submit"
const FILE_FIELD   = "attachment";
const EXTRA_FIELDS = {};   // e.g. { access_key: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" }
const FIRM_NAME  = "Monteck Carter";

const SECTIONS = [
  {num:"01", title:"Funds & cash takings", tag:"Money in & out", qs:[
    {n:1, t:"Have you paid any business expenses from personal funds or cash takings?",
     s:"Stock, fuel, tools or sundries you covered with your own cash or card — the GST is still claimable, so we need the receipts."},
    {n:2, t:"Have you paid any personal expenses from business funds or cash takings?",
     s:"Groceries, personal travel or home bills drawn from the business must be separated out so no GST is claimed in error."}
  ]},
  {num:"02", title:"Agreements, finance & assets", tag:"Contracts & capital", qs:[
    {n:3, t:"Have you entered into any agreements for hire purchase, the sale or purchase of land or other assets, leases, loans or any agreement that may, or may not, have involved a deposit during <em>the period</em>?",
     s:"These often carry special GST timing rules around deposits and settlement dates — please attach copies of any contracts."},
    {n:4, t:"Have you incurred legal fees or borrowed money in <em>the period</em>?",
     s:"Legal and finance costs are treated differently for GST — some claimable, some exempt. Provide the invoices and loan paperwork."},
    {n:5, t:"Have you bought or sold any assets in <em>the period</em>?",
     s:"Purchases and sales of vehicles, plant or equipment must be recorded with GST — please note any trade-ins."}
  ]},
  {num:"03", title:"Private use & related parties", tag:"Apportionment", qs:[
    {n:6, t:"Have you, any relative, your family trust, or any company you or they hold shares in, received goods or services from the business not charged at normal market price and included above?",
     s:"Supplies to associated people or entities below market value may require a GST adjustment."},
    {n:7, t:"Do you or any relatives use any business assets for private use?",
     s:"A work vehicle, phone or premises used privately needs the GST apportioned between business and private use."},
    {n:8, t:"Do you use any private assets for business use?",
     s:"Using your own car, home office or tools for the business may let you claim a portion of the GST."}
  ]},
  {num:"04", title:"Records & invoicing", tag:"Documentation", qs:[
    {n:9, t:"Do you have invoices for all expenses and purchases covered by <em>the period</em>?",
     s:"A valid tax invoice is required to claim GST on purchases over $50 — please check that none are missing."},
    {n:10, t:"If you are on an invoice basis, have you provided details of all accounts payable and receivable at the end of <em>the period</em>?",
     s:"On the invoice basis we account for GST when invoiced, not paid — so we need your debtors and creditors at period end."}
  ]}
];

const form = document.getElementById('gst');

/* ---------- Build the form ---------- */
form.innerHTML = `
  <div class="band" style="margin:0 -32px">
    <div>
      <label for="client">Client / Business name</label>
      <input id="client" name="client" type="text" placeholder="Enter name" autocomplete="organization" required>
    </div>
    <div>
      <label for="period">Period ended</label>
      <input id="period" name="period" type="date" value="2026-03-31" required>
    </div>
    <div>
      <label for="ird">IRD number</label>
      <input id="ird" name="ird" type="text" inputmode="numeric" placeholder="00-000-000" maxlength="11" autocomplete="off" required>
    </div>
  </div>

  <p class="intro" style="margin:22px 0 0;padding:0">
    Please answer <strong>every</strong> question below for the period shown. A short note sits under each item to explain why we ask — tick <strong>Yes</strong> or <strong>No</strong>, and enclose any paperwork mentioned.
  </p>

  ${SECTIONS.map(sec => `
    <div class="sec">
      <span class="num">${sec.num}</span>
      <h2>${sec.title}</h2>
      <span class="tag">${sec.tag}</span>
    </div>
    ${sec.qs.map(q => `
      <div class="q" data-q="${q.n}">
        <span class="n">${q.n}</span>
        <div class="t"><strong id="q${q.n}-label">${q.t}</strong><small>${q.s}</small></div>
        <div class="yn" role="radiogroup" aria-labelledby="q${q.n}-label">
          <label><input type="radio" name="q${q.n}" value="Yes"><span class="box"></span>Yes</label>
          <label><input type="radio" name="q${q.n}" value="No"><span class="box"></span>No</label>
        </div>
      </div>`).join('')}
  `).join('')}

  <div class="decl">
    We acknowledge that the information requested above is required to ensure the accuracy of our GST return and to avoid penalties. <strong>All information is enclosed and is correct.</strong>
  </div>

  <div class="sign" id="signRow">
    <div>
      <label for="sigCanvas">Signed</label>
      <div class="pad" id="pad">
        <canvas id="sigCanvas" aria-label="Signature pad – draw your signature"></canvas>
        <span class="hint">Sign here with your mouse or finger</span>
      </div>
      <button type="button" class="clear" id="clearSig">Clear signature</button>
    </div>
    <div>
      <label for="signDate">Date</label>
      <input id="signDate" name="signDate" type="date" required>
    </div>
  </div>

  <div class="actions">
    <span class="msg" id="msg" role="status" aria-live="polite"></span>
    <button type="button" class="btn ghost" id="dlBtn" hidden>Download your copy</button>
    <button type="button" class="btn ghost" id="printBtn">Print / save PDF</button>
    <button type="submit" class="btn primary" id="submitBtn">Submit questionnaire</button>
  </div>
`;

/* today's date as default */
const today = new Date();
document.getElementById('signDate').value =
  `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

/* ---------- IRD number formatting (00-000-000 or 000-000-000) ---------- */
const ird = document.getElementById('ird');
ird.addEventListener('input', () => {
  const d = ird.value.replace(/\D/g,'').slice(0,9);
  ird.value = d.length > 8 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`
            : d.length > 5 ? `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`
            : d.length > 2 ? `${d.slice(0,2)}-${d.slice(2)}` : d;
});

/* ---------- Signature pad ---------- */
const canvas = document.getElementById('sigCanvas');
const pad = document.getElementById('pad');
const ctx = canvas.getContext('2d');
let drawing = false, hasSig = false;

function sizeCanvas(){
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const keep = hasSig ? canvas.toDataURL() : null;
  canvas.width = r.width*dpr; canvas.height = r.height*dpr;
  ctx.scale(dpr,dpr);
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2a0a5e';
  if(keep){ const img = new Image(); img.onload = () => ctx.drawImage(img,0,0,r.width,r.height); img.src = keep; }
}
sizeCanvas(); window.addEventListener('resize', sizeCanvas);

const pos = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
canvas.addEventListener('pointerdown', e => {
  drawing = true; canvas.setPointerCapture(e.pointerId);
  const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
});
canvas.addEventListener('pointermove', e => {
  if(!drawing) return;
  const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); hasSig = true; pad.classList.add('signed');
});
['pointerup','pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { drawing = false; }));
document.getElementById('clearSig').addEventListener('click', () => {
  ctx.clearRect(0,0,canvas.width,canvas.height); hasSig = false; pad.classList.remove('signed');
});

/* ---------- Validation + submit ---------- */
const msg = document.getElementById('msg');
const setMsg = (t, cls='') => { msg.textContent = t; msg.className = 'msg ' + cls; };

function validate(){
  let firstBad = null, problems = [];
  document.querySelectorAll('.q').forEach(el => {
    const ok = form.querySelector(`input[name="q${el.dataset.q}"]:checked`);
    el.classList.toggle('invalid', !ok);
    if(!ok){ problems.push('questions'); firstBad = firstBad || el; }
  });
  const client = form.client.value.trim();
  if(!client){ problems.push('name'); firstBad = firstBad || form.client; }
  if(!form.period.value){ problems.push('period'); firstBad = firstBad || form.period; }
  const digits = ird.value.replace(/\D/g,'');
  if(digits.length < 8){ problems.push('ird'); firstBad = firstBad || ird; }
  const signRow = document.getElementById('signRow');
  const signOk = hasSig && form.signDate.value;
  signRow.classList.toggle('invalid', !signOk);
  if(!signOk){ problems.push('signature'); firstBad = firstBad || signRow; }

  if(firstBad){
    firstBad.scrollIntoView({behavior:'smooth', block:'center'});
    const unanswered = document.querySelectorAll('.q.invalid').length;
    const parts = [];
    if(unanswered) parts.push(`${unanswered} unanswered question${unanswered>1?'s':''}`);
    if(problems.includes('name')||problems.includes('period')||problems.includes('ird')) parts.push('client details');
    if(problems.includes('signature')) parts.push('signature and date');
    setMsg('Please complete: ' + parts.join(', ') + '.', 'err');
    return false;
  }
  return true;
}
form.addEventListener('change', e => {
  if(e.target.type === 'radio') e.target.closest('.q').classList.remove('invalid');
});

function collect(){
  const answers = {};
  SECTIONS.forEach(s => s.qs.forEach(q => {
    answers[`q${q.n}`] = {
      question: q.t.replace(/<[^>]+>/g,''),
      answer: form.querySelector(`input[name="q${q.n}"]:checked`).value
    };
  }));
  return {
    client: form.client.value.trim(),
    periodEnded: form.period.value,
    irdNumber: ird.value,
    answers,
    signedDate: form.signDate.value,
    signature: canvas.toDataURL('image/png'),
    submittedAt: new Date().toISOString()
  };
}

/* ---------- PDF of the completed form ---------- */
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => {
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'});
};

function buildPdfNode(data){
  const logo = document.querySelector('.brand img').src;
  const yn = ans => `<div class="pyn">
      <span class="l"><span class="pbox${ans==='Yes'?' on':''}">${ans==='Yes'?'&#10003;':''}</span>Yes</span>
      <span class="l"><span class="pbox${ans==='No'?' on':''}">${ans==='No'?'&#10003;':''}</span>No</span></div>`;
  const qHtml = q => `<div class="pq"><span class="pn">${q.n}</span>
      <div class="pt"><strong>${q.t}</strong><small>${q.s}</small></div>${yn(data.answers['q'+q.n].answer)}</div>`;
  const secHtml = sec => `
    <div class="pkeep">
      <div class="psec"><span class="pnum">${sec.num}</span><h2>${sec.title}</h2><span class="ptag">${sec.tag}</span></div>
      ${qHtml(sec.qs[0])}
    </div>
    ${sec.qs.slice(1).map(qHtml).join('')}`;

  const root = document.createElement('div');
  root.id = 'pdfRoot';
  root.innerHTML = `
    <div class="ptop"><img src="${logo}" alt="">
      <div class="ptitle"><div class="peyebrow">GST · CLIENT CHECKLIST</div><h1>GST Return Questionnaire</h1></div></div>
    <div class="pband">
      <div><small>Client / Business name</small><b>${esc(data.client)}</b></div>
      <div><small>Period ended</small><b>${esc(fmtDate(data.periodEnded))}</b></div>
      <div><small>IRD number</small><b>${esc(data.irdNumber)}</b></div>
    </div>
    <div class="pbody">
      <p class="pintro">Questions answered for the period shown. Yes / No ticked by the client.</p>
      ${SECTIONS.map(secHtml).join('')}
      <div class="pkeep">
        <div class="pdecl">We acknowledge that the information requested above is required to ensure the accuracy of our GST return and to avoid penalties. <strong>All information is enclosed and is correct.</strong></div>
        <div class="psign">
          <div><small>Signed</small><div class="psigbox"><img src="${data.signature}" alt="Signature"></div></div>
          <div><small>Date</small><div class="pdate">${esc(fmtDate(data.signedDate))}</div></div>
        </div>
      </div>
    </div>
    <div class="pfoot">Completed online · ${esc(new Date().toLocaleString('en-NZ'))}</div>`;
  return root;
}

async function makePdf(data){
  if(typeof html2pdf === 'undefined') throw new Error('PDF library not loaded');
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const node = buildPdfNode(data);
  document.body.appendChild(node);
  try{
    await Promise.all([...node.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(()=>{}) : null));
    return await html2pdf().set({
      margin:[8,0,8,0],
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],avoid:['.pq','.pkeep','.psec']}
    }).from(node).outputPdf('blob');
  } finally { node.remove(); }
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  setMsg('');
  if(!validate()) return;
  const data = collect();
  const btn = document.getElementById('submitBtn');
  const dlBtn = document.getElementById('dlBtn');
  const safe = s => s.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60) || 'Client';
  const filename = `GST-Questionnaire_${safe(data.client)}_${data.periodEnded}.pdf`;

  btn.disabled = true; setMsg('Preparing your PDF…');
  let blob;
  try{ blob = await makePdf(data); }
  catch(err){
    console.error(err);
    btn.disabled = false;
    setMsg('Sorry, we couldn’t create the PDF. Please check your connection and try again, or use Print / save PDF.', 'err');
    return;
  }
  dlBtn.onclick = () => downloadBlob(blob, filename);

  if(!SUBMIT_URL){
    btn.disabled = false; dlBtn.hidden = false; downloadBlob(blob, filename);
    setMsg('Your completed form has been saved as a PDF. (No submit address is set up yet, so please email it to us.)', 'ok');
    return;
  }

  setMsg('Sending…');
  try{
    const subject = `GST Return Questionnaire – ${data.client} – period ended ${fmtDate(data.periodEnded)}`;
    const fd = new FormData();
    Object.entries(EXTRA_FIELDS).forEach(([k,v]) => fd.append(k,v));
    fd.append('subject', subject);
    fd.append('_subject', subject);
    fd.append('client', data.client);
    fd.append('period_ended', fmtDate(data.periodEnded));
    fd.append('ird_number', data.irdNumber);
    fd.append('signed_date', fmtDate(data.signedDate));
    fd.append('message', 'Completed GST Return Questionnaire attached as PDF.');
    fd.append(FILE_FIELD, new File([blob], filename, {type:'application/pdf'}));
    const res = await fetch(SUBMIT_URL, {method:'POST', headers:{'Accept':'application/json'}, body:fd});
    const j = await res.json().catch(() => ({}));
    if(!res.ok || j.success === false || j.ok === false) throw new Error(j.message || res.status);
    btn.textContent = 'Submitted'; dlBtn.hidden = false;
    setMsg(`Thank you — your completed questionnaire has been sent to ${FIRM_NAME}. You can download a copy for your records.`, 'ok');
  }catch(err){
    console.error(err);
    btn.disabled = false; dlBtn.hidden = false;
    setMsg('Sorry, we couldn’t send the form. Your PDF is ready to download — please try again, or email the PDF to us.', 'err');
  }
});

document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>
</body>
</html>
